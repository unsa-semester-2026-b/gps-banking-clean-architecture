name: CI - Build, Test & Architecture Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build, Unit Tests & Architecture Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check & Build
        run: npm run build

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Check Clean Architecture Rules (Dependency Cruiser)
        run: npm run arch:check
